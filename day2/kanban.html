<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Drag and Drop Kanban Board</title>
        <style>
            * {
                box-sizing: border-box;
            }
            .board {
                display: flex;
                width: 100%;
                gap: 5px;
            }
            .container {
                width: 30%;
                display: flex;
                flex-direction: column;
                gap: 10px;
                border: solid black;
                padding: 5px;
            }
            .column {
                display: flex;
                flex-direction: column;
                width: 100%;
                min-height: 70vh;
                gap: 5px;
                padding: 4px;
            }
            .column h2 {
                text-align: center;
            }
            .column.dragon {
                background-color: blue;
            }
            .column span {
                display: flex;
            }
            .column span button {
                margin-left: auto;
            }
            .create {
                margin-top: auto;
                align-self: flex-end;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="board">
                <div class="container">
                    <div class="column todo">
                        <h2>To do</h2>
                    </div>
                    <div class="create">
                        <label for="task">Task:</label>
                        <input type="text" id="task" />
                        <button>Add</button>
                    </div>
                </div>
                <div class="container">
                    <div class="column progress">
                        <h2>In progress</h2>
                    </div>
                    <div class="create">
                        <label for="task">Task:</label>
                        <input type="text" id="task" />
                        <button>Add</button>
                    </div>
                </div>
                <div class="container">
                    <div class="column done">
                        <h2>Done</h2>
                    </div>
                    <div class="create">
                        <label for="task">Task:</label>
                        <input type="text" id="task" />
                        <button>Add</button>
                    </div>
                </div>
            </div>
            <script src="./kanban.js" type="module"></script>
        </main>
    </body>
</html>
